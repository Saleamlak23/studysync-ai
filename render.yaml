services:
  # ---------------------------------------------------------------------------
  # StudySync AI Backend API Service (Docker Container)
  # ---------------------------------------------------------------------------
  - type: web
    name: studysync-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: studysync-db
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 7d
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: AI_USER_DAILY_LIMIT
        value: "20"
      - key: AI_WORKSPACE_DAILY_LIMIT
        value: "100"
      - key: FILE_MAX_BYTES
        value: "5242880"
      - key: WORKSPACE_STORAGE_CAP_BYTES
        value: "104857600"

  # ---------------------------------------------------------------------------
  # StudySync AI Frontend Static Site (Served globally via Render CDN)
  # ---------------------------------------------------------------------------
  - type: web
    name: studysync-web
    runtime: static
    buildCommand: npm install && npm run build -w packages/shared && npm run build -w apps/web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_API_ORIGIN
        sync: false

# -----------------------------------------------------------------------------
# Managed PostgreSQL Database
# -----------------------------------------------------------------------------
databases:
  - name: studysync-db
    plan: free
    region: frankfurt
    databaseName: studysync_ai
    user: studysync
